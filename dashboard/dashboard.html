<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UM Spec Planner</title>
  <link rel="icon" href="../icons/icon48.png">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><img src="../icons/icon48.png" alt="" width="26" height="26"><strong>UM Spec</strong><span class="brand-sub" data-t="planner">Planner</span></div>
      <span class="pill mono" id="week-pill" hidden></span>
      <div class="topbar-spacer"></div>
      <span class="updated mono" id="updated"></span>
      <button type="button" class="btn" id="refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span data-t="refresh">Refresh</span></button>
      <div class="seg" role="group" aria-label="Language" id="lang-switch">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="ms">BM</button><button type="button" data-lang="zh">中</button>
      </div>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
      <button type="button" class="icon-btn" id="open-side" aria-label="Side panel" data-tip="sidePanel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
      <button type="button" class="icon-btn" id="pop-out" aria-label="Pop out" data-tip="popOut"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
    </header>
    <nav class="rail" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-view="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="calendar">Calendar</span></button>
      <button type="button" role="tab" data-view="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="18" r="1.4"/></svg><span data-t="list">List</span></button>
      <button type="button" role="tab" data-view="timetable"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M15 9v11"/></svg><span data-t="timetable">Timetable</span></button>
      <button type="button" role="tab" data-view="materials"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span data-t="materials">Materials</span></button>
      <button type="button" role="tab" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span data-t="settings">Settings</span></button>
    </nav>
    <main class="main">
      <div class="banner" id="notice" role="status" aria-live="polite" hidden></div>
      <div class="chips" id="course-chips" role="group" aria-label="Courses"></div>
      <section id="view" class="view"></section>
    </main>
  </div>
  <dialog id="preview" class="preview">
    <header><strong id="preview-title" class="mono"></strong><span class="topbar-spacer"></span><a id="preview-open" class="btn" target="_blank" rel="noopener noreferrer"></a><button type="button" class="icon-btn" id="preview-close" aria-label="Close">✕</button></header>
    <div id="preview-body" class="preview-body"></div>
  </dialog>
  <script src="../lib/jszip.min.js"></script>
  <script src="../shared/planner-core.js"></script>
  <script src="../shared/planner-collect.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
